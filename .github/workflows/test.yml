name: Test LoopGrid Evidence Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-fixtures:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify known-good evidence
        uses: ./
        with:
          evidence: ./test-fixtures/valid-evidence.zip
          trusted-public-key: ./test-fixtures/trusted-public-key.pem

      - name: Confirm tampered evidence is rejected
        shell: bash
        run: |
          set +e

          python3 verifier/loopgrid_verify.py \
            ./test-fixtures/tampered-evidence.zip \
            --trusted-public-key ./test-fixtures/trusted-public-key.pem

          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "::error::Tampered evidence unexpectedly verified."
            exit 1
          fi

          echo "Tampered fixture correctly rejected with exit code $code."
